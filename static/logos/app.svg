<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Reusable Gear Template -->
    <g id="gear" fill="#326CE5">
      <rect x="-8" y="-42" width="16" height="84" rx="4" transform="rotate(0)" />
      <rect x="-8" y="-42" width="16" height="84" rx="4" transform="rotate(60)" />
      <rect x="-8" y="-42" width="16" height="84" rx="4" transform="rotate(120)" />
      <circle cx="0" cy="0" r="34" />
      <circle cx="0" cy="0" r="17" fill="#FFFFFF" />
    </g>
  </defs>

  <!-- Outer Round Blue Container -->
  <circle cx="250" cy="250" r="235" fill="#326CE5" />

  <!-- Inner White Circle -->
  <circle cx="250" cy="195" r="140" fill="#FFFFFF" />

  <!-- Gear Cluster (Matching the original layout) -->
  <!-- Top Gear -->
  <use href="#gear" transform="translate(250, 125) scale(0.9) rotate(15)" />
  <!-- Bottom-Right Main Gear -->
  <use href="#gear" transform="translate(262, 218) scale(1.3) rotate(0)" />
  <!-- Left Gear -->
  <use href="#gear" transform="translate(175, 192) scale(0.95) rotate(10)" />

  <!-- Label Text -->
  <text 
    x="250" 
    y="435" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="62" 
    font-weight="700" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="1">App</text>
</svg>
